backend:
  name: github
  repo: rohitbhaskar/dr-sneha-jain-website
  branch: main
  base_url: https://dr-sneha-jain-cms-auth.rohitbfirephoenix3.workers.dev
  auth_endpoint: auth

media_folder: "img/uploads"
public_folder: "/img/uploads"

locale: "en"

collections:
  - name: "content"
    label: "Site Content"
    files:
      # ========== ABOUT & PROFILE ==========
      - label: "About & Profile"
        name: "about"
        file: "_data/settings/about.json"
        fields:
          - { label: "Full Name & Title", name: "name", widget: "string", default: "Dr. Sneha Jain" }
          - { label: "Specialty / Tagline", name: "subtitle", widget: "string", default: "Resident Ophthalmologist | Phaco-Refractive Specialist" }
          - { label: "Biography & Overview", name: "bio", widget: "text" }
          - { label: "Profile Photo", name: "portrait", widget: "image" }

      # ========== CONTACT DETAILS ==========
      - label: "Contact Details"
        name: "contact"
        file: "_data/settings/contact.json"
        fields:
          - { label: "Official Email", name: "email", widget: "string", default: "contact@drsnehajain.co.in" }
          - { label: "Hospital / Affiliation", name: "hospital", widget: "string", default: "Jupiter Hospital, Thane" }
          - { label: "Location", name: "location", widget: "string", default: "Thane / Mumbai, Maharashtra" }
          - { label: "LinkedIn Profile", name: "linkedin", widget: "string", required: false }
          - { label: "Google Scholar URL", name: "google_scholar", widget: "string", required: false }
          - { label: "ORCID ID", name: "orcid", widget: "string", required: false }

      # ========== PUBLICATIONS & RESEARCH ==========
      - label: "Publications & Research"
        name: "publications"
        file: "_data/publications.json"
        fields:
          - label: "Publications"
            name: "items"
            widget: "list"
            fields:
              - { label: "Paper Title", name: "title", widget: "string" }
              - { label: "Journal Name", name: "journal", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Authors", name: "authors", widget: "string" }
              - { label: "Abstract / Summary", name: "abstract", widget: "text" }
              - { label: "DOI Link", name: "doi", widget: "string", required: false }
              - { label: "PDF Document", name: "pdf", widget: "file", required: false }

      # ========== MENTOR RECOMMENDATIONS ==========
      - label: "Mentor Recommendations"
        name: "recommendations"
        file: "_data/recommendations.json"
        fields:
          - label: "Recommendations"
            name: "items"
            widget: "list"
            fields:
              - { label: "Mentor Name", name: "name", widget: "string" }
              - { label: "Designation & Hospital", name: "designation", widget: "string" }
              - { label: "Category", name: "category", widget: "string", hint: "e.g., Surgical Competence, Clinical Acumen" }
              - { label: "Recommendation Text", name: "text", widget: "text" }
              - { label: "Mentor Photo", name: "photo", widget: "image", required: false }

      # ========== SURGICAL & CLINICAL HIGHLIGHTS ==========
      - label: "Clinical & Surgical Highlights"
        name: "highlights"
        file: "_data/highlights.json"
        fields:
          - label: "Highlights Cards"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: ["Surgical Highlights", "OPD & Clinical Diversity", "Academic & Research"] }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image", name: "image", widget: "image" }