backend:
  name: github
  repo: vasiliiberezinart-ops/arthemii-website
  branch: main
  base_url: https://sveltia-cms-auth.vasiliiberezin-art.workers.dev

media_folder: "img/uploads"
public_folder: "/img/uploads"

locale: "en"

collections:
  - name: "content"
    label: "Site Content"
    files:
      # ========== EXHIBITIONS ==========
      - label: "Exhibitions"
        name: "exhibitions"
        file: "_data/exhibitions.json"
        fields:
          - label: "Exhibitions"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Type", name: "type", widget: "select", options: ["Solo Exhibition", "Group Exhibition", "Installation"] }
              - { label: "Date Start", name: "date_start", widget: "string", hint: "DD.MM.YYYY" }
              - { label: "Date End", name: "date_end", widget: "string", hint: "DD.MM.YYYY", required: false, default: "" }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Stats"
                name: "stats"
                widget: "list"
                required: false
                fields:
                  - { label: "Number", name: "num", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
              - label: "Photos"
                name: "photos"
                widget: "list"
                field:
                  label: "Photo"
                  name: "photo"
                  widget: "image"

      # ========== SIDE PRODUCTS ==========
      - label: "Side Products"
        name: "side_products"
        file: "_data/side_products.json"
        fields:
          - label: "Products"
            name: "items"
            widget: "list"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description", name: "alt", widget: "string" }

      # ========== ABOUT ==========
      - label: "About"
        name: "about"
        file: "_data/settings/about.json"
        fields:
          - { label: "Artist Name", name: "name", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Bio", name: "bio", widget: "text" }
          - { label: "Portrait", name: "portrait", widget: "image" }

      # ========== CONTACT ==========
      - label: "Contact"
        name: "contact"
        file: "_data/settings/contact.json"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Telegram", name: "telegram", widget: "string", required: false }

      # ========== WORKSPACE ==========
      - label: "Workspace"
        name: "workspace"
        file: "_data/settings/workspace.json"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Video", name: "video", widget: "file", required: false }
          - label: "Photos"
            name: "photos"
            widget: "list"
            field:
              label: "Photo"
              name: "photo"
              widget: "image"
