    <script>
    // Mobile nav
    const mb=document.getElementById('menuBtn'),mn=document.getElementById('mobileNav'),mc=document.getElementById('mobileNavClose');
    if(mb&&mn)mb.onclick=()=>mn.classList.add('is-open');
    if(mc&&mn)mc.onclick=()=>mn.classList.remove('is-open');
    if(mn)mn.querySelectorAll('a').forEach(a=>a.onclick=()=>mn.classList.remove('is-open'));
    // YT lazy
    document.querySelectorAll('.yt-placeholder').forEach(el=>{
        el.onclick=function(){
            const id=this.dataset.yt;
            const iframe=document.createElement('iframe');
            iframe.src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=0&controls=1&rel=0';
            iframe.allow='accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture';
            iframe.allowFullscreen=true;
            iframe.style.cssText='width:100%;height:100%;border:none';
            this.replaceWith(iframe);
        };
    });
    // Video hover play
    document.querySelectorAll('.video-card').forEach(c=>{
        const v=c.querySelector('video');
        if(!v)return;
        c.onmouseenter=()=>v.play().catch(()=>{});
        c.onmouseleave=()=>{v.pause();v.currentTime=0;};
    });
    </script>
